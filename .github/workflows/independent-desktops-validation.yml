name: Independent Desktops validation
on:
  push:
    branches: [feature/independent-desktops-per-monitor]
    paths:
      - 'src/modules/IndependentDesktops/**'
      - '.github/workflows/independent-desktops-validation.yml'
  pull_request:
    paths:
      - 'src/modules/IndependentDesktops/**'
      - '.github/workflows/independent-desktops-validation.yml'
  workflow_dispatch:
concurrency:
  group: independent-desktops-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure supplemental Windows tests
        run: cmake -S src/modules/IndependentDesktops -B independent-desktops-build -A x64
      - name: Build before running tests
        run: cmake --build independent-desktops-build --config Release
      - name: Test and emit machine-readable results
        run: ctest --test-dir independent-desktops-build -C Release --output-on-failure --output-junit results.xml
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-windows-results
          path: |
            independent-desktops-build/results.xml
            independent-desktops-build/Testing/Temporary/LastTest.log
  repository-integration:
    needs: standalone
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore and build Runner and Settings with repository scripts
        run: tools/build/build-essentials.ps1 -Platform x64 -Configuration Release
      - name: Build module, interface and native tests with repository scripts
        run: |
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops/ModuleInterface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops/Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build modified installer custom actions
        run: tools/build/build.ps1 -Platform x64 -Configuration Release -Path installer/PowerToysSetupCustomActionsVNext /p:RunBuildEvents=false
      - name: Run the native test project after a successful build
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe" "x64/Release/tests/IndependentDesktops/IndependentDesktopsUnitTests.dll" /Logger:trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Settings model tests before execution
        run: tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/settings-ui/Settings.UI.UnitTests
      - name: Run Settings regression suite
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe" "Release/x64/tests/SettingsTests/Settings.UI.UnitTests.dll" /Logger:trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish repository build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-integration-results
          path: |
            **/build.release.x64.errors.log
            **/build.release.x64.all.log
            TestResults/*.trx
  argument-fuzz:
    needs: standalone
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build parser fuzzer with address sanitizer
        run: |
          . tools/build/build-common.ps1
          if (-not (Ensure-VsDevEnvironment)) { exit 1 }
          clang++ --version
          clang++ -std=c++20 '-fsanitize=fuzzer,address' -DNOMINMAX -DUNICODE -D_UNICODE src/modules/IndependentDesktops/Fuzz/ArgumentFuzzer.cpp src/modules/IndependentDesktops/Recovery.cpp src/modules/IndependentDesktops/WindowOperations.cpp -luser32 -ladvapi32 -o IndependentDesktopsArgumentFuzzer.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic fuzz inputs and retain failures
        run: |
          ./IndependentDesktopsArgumentFuzzer.exe -seed=49420 -runs=10000 -max_len=64 -artifact_prefix=./ src/modules/IndependentDesktops/Fuzz/corpus 2>&1 | Tee-Object fuzz-results.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-fuzz-results
          path: |
            fuzz-results.txt
            crash-*
