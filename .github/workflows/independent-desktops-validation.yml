name: Independent Desktops validation
on:
  push:
    branches: [feature/independent-desktops-per-monitor]
    paths:
      - 'src/modules/IndependentDesktops/**'
      - 'src/settings-ui/**'
      - 'src/runner/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/utils/gpo.h'
      - 'src/common/ManagedCommon/ModuleType.cs'
      - 'src/gpo/assets/**'
      - '.pipelines/ESRPSigning_core.json'
      - 'tools/Verification scripts/**'
      - 'installer/**'
      - 'PowerToys.slnx'
      - '.github/workflows/independent-desktops-validation.yml'
  pull_request:
    paths:
      - 'src/modules/IndependentDesktops/**'
      - 'src/settings-ui/**'
      - 'src/runner/**'
      - 'src/common/GPOWrapper/**'
      - 'src/common/utils/gpo.h'
      - 'src/common/ManagedCommon/ModuleType.cs'
      - 'src/gpo/assets/**'
      - '.pipelines/ESRPSigning_core.json'
      - 'tools/Verification scripts/**'
      - 'installer/**'
      - 'PowerToys.slnx'
      - '.github/workflows/independent-desktops-validation.yml'
  workflow_dispatch:
concurrency:
  group: independent-desktops-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  standalone:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure supplemental Windows tests
        run: cmake -S src/modules/IndependentDesktops -B independent-desktops-build -A x64
      - name: Build before running tests
        run: cmake --build independent-desktops-build --config Release
      - name: Test and emit machine-readable results
        run: ctest --test-dir independent-desktops-build -C Release --output-on-failure --output-junit results.xml
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-windows-results
          path: |
            independent-desktops-build/results.xml
            independent-desktops-build/Testing/Temporary/LastTest.log
  repository-integration:
    needs: standalone
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore and build Runner and Settings with repository scripts
        run: tools/build/build-essentials.ps1 -Platform x64 -Configuration Release
      - name: Build module, interface and native tests with repository scripts
        run: |
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops/ModuleInterface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/modules/IndependentDesktops/Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build modified installer custom actions
        run: tools/build/build.ps1 -Platform x64 -Configuration Release -Path installer/PowerToysSetupCustomActionsVNext /p:RunBuildEvents=false
      - name: Run the native test project after a successful build
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe" "x64/Release/tests/IndependentDesktops/IndependentDesktopsUnitTests.dll" /Logger:trx /Platform:x64 -- RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Settings model tests before execution
        run: tools/build/build.ps1 -Platform x64 -Configuration Release -Path src/settings-ui/Settings.UI.UnitTests
      - name: Run Settings regression suite
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe" "Release/x64/tests/SettingsTests/Settings.UI.UnitTests.dll" /Logger:trx /Platform:x64 -- RunConfiguration.TreatNoTestsAsError=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish repository build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-integration-results
          path: |
            **/build.release.x64.errors.log
            **/build.release.x64.all.log
            TestResults/*.trx
  argument-fuzz:
    needs: standalone
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build parser fuzzer with address sanitizer
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'x64') { throw 'An x64 compiler environment is required' }
          clang++ --version
          clang++ -std=c++20 '-fsanitize=fuzzer,address' -DNOMINMAX -DUNICODE -D_UNICODE src/modules/IndependentDesktops/Fuzz/ArgumentFuzzer.cpp src/modules/IndependentDesktops/Recovery.cpp src/modules/IndependentDesktops/WindowOperations.cpp -luser32 -ladvapi32 -o IndependentDesktopsArgumentFuzzer.exe 2>&1 | Tee-Object fuzz-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $resource = & clang++ -print-resource-dir
          $asan = Join-Path $resource 'lib/windows/clang_rt.asan_dynamic-x86_64.dll'
          if (-not (Test-Path $asan)) { throw "Matching ASan runtime missing: $asan" }
          Copy-Item $asan .
      - name: Run deterministic fuzz inputs and retain failures
        run: |
          $fuzzArguments = @('-seed=49420', '-runs=10000', '-max_len=64', 'src/modules/IndependentDesktops/Fuzz/corpus')
          & ./IndependentDesktopsArgumentFuzzer.exe @fuzzArguments 2>&1 | Tee-Object fuzz-results.txt
          $fuzzExit = $LASTEXITCODE
          "Fuzzer exit code: $fuzzExit" | Tee-Object -Append fuzz-results.txt
          if ($fuzzExit -ne 0) { exit $fuzzExit }
      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-desktops-fuzz-results
          path: |
            src/modules/IndependentDesktops/Fuzz/corpus/*
            fuzz-build.txt
            fuzz-results.txt
            crash-*
